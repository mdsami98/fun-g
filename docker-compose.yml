services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gaming_platform}
    ports:
      - "${DB_HOST_PORT:-5334}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-1111}:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-1001}:1001"
    environment:
      PORT: 1001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-gaming_platform}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_SUPER_ADMIN_PHONE: ${SEED_SUPER_ADMIN_PHONE:-+8801700000000}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_SUPER_ADMIN_NAME: ${SEED_SUPER_ADMIN_NAME:-Super Admin}
      GAME_BETTING_DURATION_MS: ${GAME_BETTING_DURATION_MS:-7000}
      GAME_CRASH_PAUSE_MS: ${GAME_CRASH_PAUSE_MS:-4000}
      GAME_TICK_INTERVAL_MS: ${GAME_TICK_INTERVAL_MS:-100}
      GAME_HOUSE_EDGE: ${GAME_HOUSE_EDGE:-0.03}
      GAME_GROWTH_BASE: ${GAME_GROWTH_BASE:-1.000063}
      GAME_MAX_MULTIPLIER: ${GAME_MAX_MULTIPLIER:-1000}
      GAME_MIN_BET: ${GAME_MIN_BET:-10}
      GAME_MAX_BET: ${GAME_MAX_BET:-10000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-1002}:1002"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-1001}
    depends_on:
      - backend

volumes:
  postgres_data:
